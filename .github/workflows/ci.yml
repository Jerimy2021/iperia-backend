name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  # Empaqueta la API para AWS Lambda (ver serverless.yml y docs/aws-lambda.md).
  # Corre aparte de las pruebas y solo si estas pasan; no despliega nada.
  package:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish (linux-arm64)
        run: dotnet publish src/Iperia.Api --configuration Release --runtime linux-arm64 --self-contained false --output artifacts/publish

      - name: Zip
        run: cd artifacts/publish && zip -r ../iperia-api.zip .

      - name: Subir paquete
        uses: actions/upload-artifact@v4
        with:
          name: iperia-api-lambda
          path: artifacts/iperia-api.zip
          retention-days: 7
